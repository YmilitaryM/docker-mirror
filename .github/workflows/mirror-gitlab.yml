name: mirror-gitlab-ce

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'gitlab-ce 版本，例如 15.4.6-ce.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image from Docker Hub
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo ">>> 拉取 gitlab/gitlab-ce:${VERSION} ..."
          docker pull "gitlab/gitlab-ce:${VERSION}"
          echo ">>> 打标签 ghcr.io/${OWNER}/gitlab-ce:${VERSION} ..."
          docker tag "gitlab/gitlab-ce:${VERSION}" "ghcr.io/${OWNER}/gitlab-ce:${VERSION}"
          echo ">>> 推送到 GHCR ..."
          docker push "ghcr.io/${OWNER}/gitlab-ce:${VERSION}"
          echo ">>> 完成"

      - name: Make package public
        run: |
          set -e
          gh api --method PATCH \
            "/user/packages/container/gitlab-ce/visibility" \
            -f visibility=public \
            --silent \
          && echo ">>> 已设为 public" \
          || echo ">>> public 设置失败(可能已public或权限不足,稍后手动处理)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
